<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>knobs — die</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 72px; background: #0e0e10; color: rgba(255,255,255,.92); font: 13px/1.4 system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .stage { display: grid; grid-template-columns: auto auto auto; gap: 28px 56px; align-items: center; justify-items: center; }
      .label { color: rgba(255,255,255,.42); font-size: 12px; }
      .header { display: flex; padding: 6px; border-radius: 12px; background: #1c1c1e; }
      .btn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; border: 0; background: transparent; color: rgba(255,255,255,.64); cursor: pointer; padding: 0; }
      .btn:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.92); }
      .big { display: grid; place-items: center; min-width: 200px; min-height: 200px; cursor: pointer; }
      #panel { width: 300px; }
    </style>
  </head>
  <body>
    <div class="stage">
      <span></span><span class="label">DOM</span><span class="label">GPU</span>
      <span class="label">icon</span>
      <div class="header"><button class="btn" id="dom-small" aria-label="Roll"></button></div>
      <div class="header"><button class="btn" id="gpu-small" aria-label="Roll"></button></div>
      <span class="label">large</span>
      <div class="big" id="dom-big"></div>
      <div class="big" id="gpu-big"></div>
    </div>
    <div id="panel"></div>
    <script type="module" src="./die.ts"></script>
  </body>
</html>
