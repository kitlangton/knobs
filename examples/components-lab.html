<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components lab · knobs in a three-pane split</title>
    <style>
      /* OpenCode Desktop's components lab, in miniature: a tree of stories, the story, and its
         controls, each a pane of one knobs/ui split on the app's near-black page. */
      html, body { margin: 0; height: 100%; background: #0b0b0c; color: #e6e6e6; font: 13px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overflow: hidden; }
      .lab { position: absolute; inset: 44px 12px 12px; }
      .story { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; background: #161617; }
      .story .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 360px; }
      .story .chip { padding: 4px 10px; border-radius: 999px; background: #232325; color: #cfcfd2; font-size: 12px; }
      .story .caption { color: #8a8a8f; font-size: 12px; }
      .story .composer { box-sizing: border-box; width: min(420px, 80%); min-height: 64px; padding: 10px 12px; border-radius: 10px; background: #1f1f21; color: #e6e6e6; white-space: pre-wrap; }
      .story .composer[data-empty] { color: #6d6d72; }
      .story .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #3a3a3d; border-top-color: #e6e6e6; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { rotate: 1turn } }
      .story:has(.entrance) { justify-content: stretch; align-items: stretch; gap: 0; }
      .entrance { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
      .entrance-card { box-sizing: border-box; width: 260px; padding: 14px 10px 10px; border-radius: 14px; background: #1f1f21; box-shadow: inset 0 0 0 1px #2a2a2d, 0 12px 32px -12px #000; transform-origin: 50% 40%; }
      .entrance-header { padding: 0 6px 10px; font-weight: 600; font-size: 14px; color: #f1f1f3; }
      .entrance-row { padding: 6px; border-radius: 6px; color: #b9b9be; font-size: 12.5px; }
      .entrance-row + .entrance-row { box-shadow: inset 0 1px 0 #2a2a2d; border-radius: 0; }
      .entrance-button { margin-top: 10px; padding: 7px 0; border-radius: 8px; background: #e6e6e6; color: #0b0b0c; text-align: center; font-weight: 600; font-size: 12.5px; }
      .entrance-dock { flex: none; box-shadow: inset 0 1px 0 #2a2a2d; }
      .entrance-dock .knobs-ui.knobs-timeline { height: auto; }
    </style>
  </head>
  <body>
    <div class="lab" id="lab"></div>
    <script type="module" src="/components-lab.ts"></script>
  </body>
</html>
