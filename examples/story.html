<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story · How OpenCode's onboarding broke</title>
    <style>
      /* The onboarding story rebuilt from knobs/review: a pure black page, the walkthrough and
         its media, nothing of the page's own but its edge. */
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #000; }
      /* The walkthrough spans the page: its rail near the left edge, its column centred beside it. */
      main { padding: 24px 16px 0; }
      @media (max-width: 640px) { main { padding: 16px 16px 0; } }
      /* A recording that isn't in this checkout (examples/assets/story is gitignored). */
      .story-missing { display: grid; place-content: center; gap: var(--_k-space-title); width: 100%; aspect-ratio: var(--aspect, 16 / 10);
        border-radius: var(--_k-radius-panel); box-shadow: inset 0 0 0 1px var(--_k-border);
        color: var(--_k-fg-3); font-size: var(--_k-type-small); line-height: var(--_k-leading-small); text-align: center; }
      .knobs-walkthrough .story-missing code { padding: 0; background: none; color: var(--_k-fg-2); }
    </style>
  </head>
  <body>
    <main id="page"></main>
    <script type="module" src="./story.ts"></script>
  </body>
</html>
