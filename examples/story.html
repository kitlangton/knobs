<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story · How OpenCode's onboarding broke</title>
    <style>
      /* The onboarding story rebuilt from knobs/ui on Void: a pure black page, the walkthrough and
         its media, nothing of the page's own but its edge. */
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #000; }
      /* The walkthrough spans the page: its rail near the left edge, its column centred beside it. */
      main { padding: 24px 16px 0; }
      @media (max-width: 640px) { main { padding: 16px 16px 0; } }
      /* A recording that isn't in this checkout (examples/assets/story is gitignored). */
      .story-missing { display: grid; place-content: center; gap: 4px; width: 100%; aspect-ratio: var(--aspect, 16 / 10);
        border-radius: 8px; box-shadow: inset 0 0 0 1px color-mix(in oklch, currentColor 14%, transparent);
        color: color-mix(in oklch, currentColor 55%, transparent); font: 12px/16px system-ui, sans-serif; text-align: center; }
      .story-missing code { font: 11px/16px ui-monospace, monospace; opacity: .8; }
    </style>
  </head>
  <body>
    <main id="page"></main>
    <script type="module" src="./story.ts"></script>
  </body>
</html>
