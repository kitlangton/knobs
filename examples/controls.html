<!doctype html>
<html lang="en" data-theme="dark">
  <head>

    <script>
      // Appearance is independent of the look. System is the default, including on a
      // returning visit after the OS changed; both resting palettes are cached below.
      let appearance = "system"
      try {
        const query = new URLSearchParams(location.search).get("appearance")
        const saved = ["system", "light", "dark"].includes(query)
          ? query : localStorage.getItem("knobs-site-appearance")
        if (["system", "light", "dark"].includes(saved)) appearance = saved
      } catch {}
      const dark = appearance === "system"
        ? matchMedia("(prefers-color-scheme: dark)").matches
        : appearance === "dark"
      document.documentElement.dataset.theme = dark ? "dark" : "light"
      document.documentElement.dataset.appearance = appearance
      try {
        const look = JSON.parse(localStorage.getItem("knobs-site-look") || "null")
        const css = look?.modes?.[dark ? "dark" : "light"] || (look?.dark === dark ? look?.css : null)
        if (typeof css === "string") {
          document.documentElement.setAttribute("style", css)
          document.documentElement.dataset.siteLook = ""
        }
      } catch {}
      // The settings panel's last height holds its place until it mounts, so nothing moves.
      try {
        const h = Number(localStorage.getItem("knobs-site-knob-h"))
        if (h > 200 && h < 2000) document.documentElement.style.setProperty("--knob-h", `${h}px`)
      } catch {}
    </script>
    <style>
      /* knobs' own look: the panels' palette, type and radii on a calm page. The page scrolls in
         .scroller, under a fixed top bar, so the WebGPU overlay clips panels at its edge. Nothing
         that holds a panel makes a stacking context (no transform, opacity or z-index on it). */
      :root {
        --night: #0a0a0b; --page: var(--night); --card: #1c1c1d; --surface: rgba(255, 255, 255, .045); --surface-hi: rgba(255, 255, 255, .09);
        --line: rgba(255, 255, 255, .075); --text: rgba(255, 255, 255, .92); --label: rgba(255, 255, 255, .62);
        --dim: rgba(255, 255, 255, .4); --faint: rgba(255, 255, 255, .16); --accent: #fff; --pill: rgba(255, 255, 255, .13);
        --lift: 0 1px 2px rgba(0, 0, 0, .16); --warm: #ffb35c; --cool: #7cc4ff;
        --sans: system-ui, -apple-system, "SF Pro Text", sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
        --ease: cubic-bezier(.2, .8, .2, 1);
        color-scheme: dark;
      }
      html[data-theme="light"] {
        --page: #e6e6e8; --card: #f5f5f7; --surface: rgba(0, 0, 0, .04); --surface-hi: rgba(0, 0, 0, .08);
        --line: rgba(0, 0, 0, .08); --text: rgba(0, 0, 0, .88); --label: rgba(60, 60, 67, .7);
        --dim: rgba(60, 60, 67, .5); --faint: rgba(0, 0, 0, .14); --accent: #1c1c1e; --pill: #fff;
        --lift: 0 1px 2px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .06); --warm: #e08a2a; --cool: #2f86d6;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--page); color: var(--text); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background-color .3s var(--ease), color .3s var(--ease); }
      a { color: inherit; text-decoration: none; outline: none; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; outline: none; }
      kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 5px; background: var(--surface-hi); color: var(--label); font: 500 11px/1 var(--sans); }

      /* The top bar comes last in the DOM, so Tab and hint keys reach the hero first. */
      .app { display: grid; grid-template-rows: 48px auto 1fr; grid-template-areas: "top" "strip" "scroll"; height: 100%; }
      .scroller { grid-area: scroll; }
      .strip { grid-area: strip; }
      .top { grid-area: top; display: flex; align-items: center; gap: 4px; padding: 0 14px 0 18px; }
      .top .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13px; margin-right: 10px; }
      .top .brand::before { content: ""; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--text); background: conic-gradient(from 210deg, var(--text) 0 4%, transparent 4%); }
      .top .spacer { flex: 1; }
      .top .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; color: var(--label); transition: background-color .15s, color .15s; }
      .top .btn:hover, .top .btn:focus-visible { background: var(--surface); color: var(--text); }
      .top .btn kbd { height: 17px; font-size: 10.5px; }
      .top .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--surface); margin: 0 4px; }
      .top .seg a { height: 24px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 7px; color: var(--label); font-size: 12px; transition: background-color .15s, color .15s, box-shadow .15s; }
      .top .seg a:hover { color: var(--text); }
      .top .seg a.on { background: var(--pill); color: var(--text); box-shadow: var(--lift); font-weight: 500; }
      .top .theme { width: 30px; justify-content: center; padding: 0; }

      /* Narrow screens: the index becomes a strip of categories under the top bar. */
      .strip { display: none; gap: 2px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
      .strip a { flex: none; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 7px; color: var(--label); font-size: 12px; transition: background-color .15s, color .15s; }
      .strip a.on { background: var(--surface-hi); color: var(--text); }

      .scroller { overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
      .layout { display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 56px; max-width: 1180px; margin: 0 auto; padding: 28px 36px 160px; }
      .index { position: sticky; top: 28px; align-self: start; max-height: calc(100vh - 48px - 56px); overflow: auto; scrollbar-width: none; padding-bottom: 12px; }
      .index .cat { margin: 18px 0 4px 10px; color: var(--dim); font: 600 10.5px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; }
      .index .cat:first-child { margin-top: 2px; }
      .index a { display: block; padding: 4px 10px; border-radius: 7px; color: var(--label); font-size: 12.5px; transition: background-color .15s, color .15s; }
      .index a:hover { color: var(--text); }
      .index a.on { background: var(--surface); color: var(--text); font-weight: 500; }
      .index a:focus-visible, .strip a:focus-visible, .top .seg a:focus-visible { background: var(--surface-hi); color: var(--text); }

      /* The page's keys (?), in a popover from the top bar. */
      .page-keys { display: grid; gap: 6px; padding: 10px 12px; font-size: 12px; color: var(--label); }
      .page-keys > div { display: grid; grid-template-columns: 72px auto; align-items: center; gap: 10px; }
      .page-keys > div > span:first-child { display: inline-flex; gap: 3px; }


      .cathead { margin: 72px 0 0; padding-bottom: 12px; color: var(--dim); font: 600 11px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; }
      .cathead:first-child { margin-top: 2px; }

      section.demo { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px 24px; padding: 28px 0 36px; border-top: 1px solid var(--line); scroll-margin-top: 12px; }
      section.demo > header { grid-column: 1 / -1; }
      section.demo h2 { display: inline-block; margin: 0; font: 600 17px/1.3 var(--sans); letter-spacing: -.01em; }
      section.demo h2[data-tip] { cursor: help; }
      section.demo header p { margin: 2px 0 0; color: var(--label); font-size: 13px; }
      section.demo .slot { min-width: 0; }
      section.demo .slot .knobs-panel { --k-width: 100%; }
      section.demo.wide { grid-template-columns: minmax(0, 1fr); }
      .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
      .side:empty { display: none; }
      .note { margin: 0; color: var(--label); font-size: 12px; }
      .shows { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .shows code { padding: 1px 6px; border-radius: 5px; background: var(--surface); color: var(--dim); font: 500 10.5px/1.6 var(--mono); }

      /* Visuals: transforms and opacity only on the DOM ones. */
      .stage { position: relative; min-height: 220px; border-radius: 16px; background: var(--surface); overflow: hidden; display: grid; place-items: center; user-select: none; -webkit-user-select: none; }
      .side > .stage { flex: 1 1 auto; }
      section.demo.scene .stage { min-height: 540px; }
      .stage .caption { position: absolute; left: 12px; bottom: 9px; color: var(--dim); font: 500 11px/1 var(--sans); font-variant-numeric: tabular-nums; }
      .stage:focus-visible { background: var(--surface-hi); }
      .stage code, .side code { font: 11.5px var(--mono); color: var(--label); }
      .abs { position: absolute; left: 0; top: 0; will-change: transform; }
      .catalog-pin { width: 16px; height: 16px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--dim); display: grid; place-items: center; opacity: 0; cursor: pointer; transition: opacity .15s, color .15s; }
      .catalog-pin[data-pinned] { opacity: 1; color: var(--text); }
      .knobs-row:hover .catalog-pin, .knobs-row:focus-within .catalog-pin { opacity: 1; }

      /* The looks: three like tiles, each a stand-in for the app around its panel. knobs' own look
         brings its card; labPreset and the flat frame sit straight on the tile, as on an app's column. */
      .host { border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); padding: 12px; }
      .host .knobs-panel { --k-width: 100%; }
      .looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }
      .looks h3 { margin: 0 0 8px; color: var(--dim); font: 600 10.5px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; }
      /* A panel that draws its own frame sits on the page alone: one frame, not a frame in a box.
         The flat frame draws none, so its host is the frame. */
      .looks > div > .host:not(.flat-host) { background: none; box-shadow: none; padding: 0; border-radius: 0; }
      .looks .flat-host { --k-frame: flat; background: var(--card); }

      /* Themes: a column per theme, on that theme's own page colour (controls-themes.ts). */
      .theme-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
      .theme-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 12px; border-radius: var(--r-stage, 16px); background: var(--col-page); color: var(--col-dim); box-shadow: inset 0 0 0 1px var(--line); transition: background-color .3s var(--ease), color .3s var(--ease); }
      .theme-col h3 { margin: 0 0 2px 2px; font: 600 10.5px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--col-dim); }
      .theme-col .tree-box { position: relative; height: 124px; padding: 6px 0; overflow: hidden; }
      .theme-col .acts { display: flex; flex-wrap: wrap; gap: 6px; }
      .theme-col .act { height: 26px; padding: 0 10px; border-radius: 13px; color: var(--col-text); background: color-mix(in srgb, var(--col-text) 8%, transparent); font-size: 12px; transition: background-color .15s; }
      .theme-col .act:hover, .theme-col .act:focus-visible { background: color-mix(in srgb, var(--col-text) 14%, transparent); }

      .ui-box { position: relative; height: 230px; border-radius: 14px; background: var(--surface); overflow: hidden; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 9px; background: var(--surface-hi); color: var(--text); font-size: 12.5px; transition: background-color .15s; }
      .chip:hover, .chip:focus-visible { background: var(--faint); }
      .chip.quiet { background: var(--surface); color: var(--label); }
      .chip.danger { color: #ff6b5e; }
      html[data-theme="light"] .chip.danger { color: #d63a2c; }

      @media (max-width: 1040px) {
        .layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 20px 24px 140px; }
        .index { display: none; }
        .strip { display: flex; }
        .looks, .theme-cols { grid-template-columns: minmax(0, 1fr); }
      }
      @media (max-width: 720px) {
        section.demo { grid-template-columns: minmax(0, 1fr); }
        .top .hide-narrow { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        html, body, .index a, .strip a, .chip, .theme-col, .theme-col .act { transition: none; }
      }
    </style>
  </head>

          <script>

              const title = JSON.parse(localStorage.getItem("knobs-site-look") || "null")?.title
              const svg = document.querySelector(".mast-vector")
              const box = title?.viewBox?.split(" ").map(Number)
              if (svg && title?.version === 2 && box?.length === 4 && box.every(Number.isFinite) &&

                  title.advance < 10 && Array.isArray(title.paths) && title.paths.length === 5 &&
                  title.paths.every(p => typeof p === "string" && /^[MLZ0-9 .-]+$/.test(p))) {
                svg.setAttribute("viewBox", title.viewBox)
                svg.style.setProperty("--title-advance", String(title.advance))
