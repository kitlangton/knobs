<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab · Diff</title>
    <style>
      /* The Lab's top bar and page, with a review under it: knobs' own look by default, Arcade's
         flat Lab with ?look=lab (see lab-look.ts). */
      :root {
        --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        --page: #141518; --line: #23252a; --text: #d8dbe0; --label: #8b9098; --dim: #5b6068; --field: #0e0f11;
        color-scheme: dark;
      }
      html[data-look="knobs"] {
        --page: #101012; --line: rgba(255, 255, 255, .1); --text: rgba(255, 255, 255, .92);
        --label: rgba(255, 255, 255, .64); --dim: rgba(255, 255, 255, .42); --field: rgba(0, 0, 0, .26);
        --surface: rgba(255, 255, 255, .055); --pill: rgba(255, 255, 255, .13); --lift: 0 1px 2px rgba(0, 0, 0, .16);
        --sans: system-ui, -apple-system, "SF Pro Text", sans-serif;
      }
      html[data-look="knobs"][data-theme="light"] {
        --page: #e6e6eb; --line: rgba(0, 0, 0, .1); --text: rgba(0, 0, 0, .88);
        --label: rgba(60, 60, 67, .68); --dim: rgba(60, 60, 67, .5); --field: rgba(0, 0, 0, .065);
        --surface: rgba(0, 0, 0, .05); --pill: #fff; --lift: 0 1px 2px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .06);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--text); font: 12px/1.35 var(--sans); -webkit-font-smoothing: antialiased; }
      button { font: inherit; color: var(--label); background: transparent; border: 0; padding: 0 8px; height: 26px; cursor: pointer; }
      button:hover { color: var(--text); }
      .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; background: var(--page); }
      .top b { font-size: 13px; font-weight: 600; margin-right: 10px; }
      .top .spacer { flex: 1; }
      .top a.nav { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; color: var(--label); text-decoration: none; }
      .top a.nav:hover { color: var(--text); }
      .top .seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); }
      .top .seg button { height: 22px; }
      .top .seg button.on { color: var(--text); background: #1e2024; }
      .top .theme { width: 26px; padding: 0; }
      html[data-look="lab"] .top .theme { display: none; }
      html[data-look="knobs"] .top button, html[data-look="knobs"] .top a.nav { border-radius: 8px; transition: background .15s, color .15s; }
      html[data-look="knobs"] .top :is(button, a.nav):hover { background: var(--surface); }
      html[data-look="knobs"] .top .seg { border: 0; border-radius: 9px; background: var(--field); }
      html[data-look="knobs"] .top .seg button { border-radius: 7px; }
      html[data-look="knobs"] .top .seg button:hover { background: transparent; }
      html[data-look="knobs"] .top .seg button.on { background: var(--pill); box-shadow: var(--lift); font-weight: 500; }
      html[data-look="lab"] .top { border-bottom: 1px solid var(--line); }
      main { display: flex; flex-direction: column; gap: 18px; padding: 0 9px 40px; }
      /* The review fills most of the view; the split's panes are the cards. */
      #review { height: min(640px, calc(100vh - 120px)); min-height: 360px; }
      .cap { margin: 0 3px 8px; color: var(--label); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
      .alone { max-width: 820px; padding: 0 3px; }
      /* A walkthrough's column: each step one card (.knobs-surface), so what's in it draws none. */
      .walk { max-width: 820px; padding: 0 3px; display: flex; flex-direction: column; gap: 14px; }
      .step { padding: 14px; border-radius: 14px; background: var(--card, #1a1b1f); box-shadow: inset 0 0 0 1px var(--line); }
      html[data-theme="light"] .step { --card: #fff; }
      html[data-look="lab"] .step { border-radius: 0; --card: #181a1d; }
      .step p { margin: 0 0 10px; color: var(--label); font-size: 12.5px; line-height: 1.5; }
      .step .tall { height: 420px; }
      .drawn { position: fixed; right: 12px; bottom: 10px; z-index: 5; padding: 4px 8px; border-radius: 6px; background: var(--page); color: var(--dim);
        box-shadow: inset 0 0 0 1px var(--line); font: 11px ui-monospace, "SF Mono", Menlo, monospace; }
      .status { min-height: 16px; margin: 6px 3px 0; color: var(--dim); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="top">
      <b>Lab · Diff</b>
      <a class="nav" href="lab.html">← Lab</a>
      <span class="spacer"></span>
      <div class="seg look-switch" role="radiogroup" aria-label="Look"><button role="radio" data-look="knobs">knobs</button><button role="radio" data-look="lab">Lab</button></div>
      <button class="theme" id="theme" aria-label="Light or dark">☾</button>
    </div>
    <main>
      <section>
        <div id="review"></div>
        <div class="status" id="status"></div>
      </section>
      <section class="alone">
        <div class="cap">codeDiff alone · height: "auto" · stack</div>
        <div id="card"></div>
      </section>
      <section class="walk" id="walk">
        <div class="cap">In a walkthrough · one surface, drawn near the viewport</div>
      </section>
    </main>
    <div class="drawn" id="drawn"></div>
    <script type="module" src="./lab-diff.ts"></script>
  </body>
</html>
