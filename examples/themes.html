<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Themes · knobs</title>
    <style>
      /* Every piece in four columns, each a theme and an appearance; a builder panel on the right
         edits a theme of your own (defineTheme's dials), which any column can show. */
      :root { color-scheme: dark; --page: #0b0b0c; --text: #e8e8ea; --dim: #8a8a90; --builder: 300px; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--page); color: var(--text); font: 12px/1.4 system-ui, -apple-system, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; }
      .top { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px 10px; margin-right: var(--builder); }
      .top b { font-size: 13px; font-weight: 600; }
      .top .dim { color: var(--dim); }
      .top a { color: var(--dim); text-decoration: none; }
      .top a:hover { color: var(--text); }
      .top .fill { flex: 1; }
      #gallery { display: grid; grid-template-columns: repeat(4, minmax(300px, 1fr)); column-gap: 10px; padding: 0 16px 40px; margin-right: var(--builder); }
      /* A column is its cells, one per row, on the theme's page colour. */
      .cell { min-width: 0; padding: 12px 12px 16px; background: var(--cell-page); color: var(--cell-dim);
        transition: background-color .35s cubic-bezier(.2, .8, .2, 1), color .35s cubic-bezier(.2, .8, .2, 1); }
      .cell.head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 12px 12px 0 0; }
      .cell.last { border-radius: 0 0 12px 12px; }
      .cell h3 { margin: 0 0 8px; font-size: 11px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--cell-dim); }
      .cell .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .cell .stack { display: flex; flex-direction: column; gap: 8px; }
      .cell button.pick { font: inherit; font-weight: 600; color: var(--cell-text); background: transparent; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
      .cell button.pick:hover { background: color-mix(in srgb, var(--cell-text) 10%, transparent); }
      .cell button.act { font: inherit; color: var(--cell-text); background: color-mix(in srgb, var(--cell-text) 8%, transparent); border: 0; padding: 0 10px; height: 26px; border-radius: 999px; cursor: pointer; }
      .cell button.act:hover { background: color-mix(in srgb, var(--cell-text) 14%, transparent); }
      .box { position: relative; overflow: hidden; }
      .split-box { height: 220px; border-radius: 12px; }
      .tree-box { height: 200px; padding: 6px 0; border-radius: 12px; }
      .activity-box { height: 300px; border-radius: 12px; }
      .bento-box { height: 240px; border-radius: 12px; }
      .review-box { height: 340px; border-radius: 12px; }
      /* The chip and the notice, as they'd sit on a page, held in the flow here. */
      .cell .knobs-chip.knobs-chip, .cell .knobs-notice.knobs-notice { position: relative; left: auto; top: auto; bottom: auto; translate: none; z-index: auto; }
      .canvas { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; }
      .note { padding: 8px 12px; font-size: 12px; line-height: 1.5; }
      #builder { position: fixed; top: 0; right: 0; bottom: 0; width: var(--builder); overflow: auto; padding: 12px 12px 24px 0; }
    </style>
  </head>
  <body>
    <header class="top">
      <b>Themes</b>
      <span class="dim">Knobs and Void, dark and light. Click a column's name to change it; the builder makes a theme of your own.</span>
      <span class="fill"></span>
      <a href="lab.html">Lab</a>
      <a href="controls.html">Controls</a>
    </header>
    <div id="gallery"></div>
    <aside id="builder"></aside>
    <script type="module" src="./themes.ts"></script>
  </body>
</html>
