<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="knobs: embeddable, keyboard-first tuning controls for React, Solid and plain DOM." />
    <meta name="color-scheme" content="light dark" />
    <title>knobs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Crect x='7' y='10' width='18' height='3' rx='1.5' fill='%23fff' opacity='.4'/%3E%3Crect x='7' y='19' width='18' height='3' rx='1.5' fill='%23fff' opacity='.4'/%3E%3Ccircle cx='19' cy='11.5' r='3.5' fill='%23fff'/%3E%3Ccircle cx='12' cy='20.5' r='3.5' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Resolve the saved theme before first paint so a dark visitor never sees a white flash.
      try {
        var saved = JSON.parse(localStorage.getItem("knobs:site:state:v1") || "null")
        var theme = (saved && saved.values && saved.values.theme) || "auto"
        if (theme === "auto") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
