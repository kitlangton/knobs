    <script>
      // Resolve the saved theme before first paint so a dark visitor never sees a white flash.
      try {
        var saved = JSON.parse(localStorage.getItem("knobs:site:state:v1") || "null")
        var theme = (saved && saved.values && saved.values.theme) || "auto"
        if (theme === "auto") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
