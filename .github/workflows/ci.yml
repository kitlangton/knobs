name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The browser suite runs only on request: the repo is private, where macOS minutes bill 10×.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome format .
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
  browser:
    if: github.event_name == 'workflow_dispatch'
    # macOS: the panels are measured against Apple's system fonts.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: test-results/
