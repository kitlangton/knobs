name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      # prepublishOnly runs the typecheck, the tests and the build.
      # A prerelease (0.4.0-next.0) goes to the "next" tag, so "latest" only moves on a full release.
      - run: |
          if node -e "process.exit(require('./package.json').version.includes('-') ? 0 : 1)"; then
            npm publish --tag next
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            npm publish
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
